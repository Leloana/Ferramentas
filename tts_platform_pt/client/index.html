<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TTS em Português</title>
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <main class="container">
    <h1>🗣️ TTS em Português</h1>
    <p class="subtitulo">XTTS-v2 (Coqui) + normalização de texto via Ollama</p>

    <label for="texto">Texto</label>
    <textarea id="texto" rows="6" placeholder="Digite o texto a ser narrado..."></textarea>
    <p id="contador-tokens" class="contador-tokens" hidden></p>

    <div class="linha">
      <div class="campo">
        <label for="voz">Voz</label>
        <select id="voz" disabled>
          <option>Carregando vozes...</option>
        </select>
      </div>

      <div class="campo">
        <label for="upload-voz">Clonar nova voz (.wav)</label>
        <input type="file" id="upload-voz" accept=".wav" disabled>
      </div>
    </div>

    <label class="checkbox">
      <input type="checkbox" id="normalizar" checked>
      Normalizar texto com IA (Ollama) antes de sintetizar
    </label>

    <button id="gerar" disabled>Gerar áudio</button>

    <div class="status-linha">
      <span id="spinner" class="spinner" hidden></span>
      <p id="status">Carregando vozes... (na primeira vez, baixa o modelo XTTS-v2 do Hugging Face, ~1.8GB — pode levar alguns minutos)</p>
    </div>

    <div id="resultado" class="resultado" hidden>
      <p id="aviso-normalizacao" class="aviso" hidden></p>
      <audio id="player" controls></audio>
      <a id="baixar" download="audio.wav">Baixar .wav</a>
      <details id="texto-usado-wrap">
        <summary>Texto usado na síntese</summary>
        <p id="texto-usado"></p>
      </details>
    </div>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
