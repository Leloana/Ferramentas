<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Partitura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎹</text></svg>">
</head>
<body>
  <header class="topo">
    <div class="marca">
      <span class="logo">𝄞</span>
      <div>
        <h1>Partitura</h1>
        <p>música com voz → partitura de piano, com letra</p>
      </div>
    </div>
    <nav class="abas">
      <button class="aba ativa" data-aba="buscar">Buscar</button>
      <button class="aba" data-aba="biblioteca">Biblioteca <span id="contBib" class="cont"></span></button>
      <button class="aba" data-aba="fila">Fila <span id="contFila" class="cont"></span></button>
    </nav>
  </header>

  <main>
    <!-- BUSCAR -->
    <section id="buscar" class="painel ativo">
      <form id="formBusca" class="busca">
        <input id="q" type="search" placeholder="Nome da música ou artista… (ex.: Chega de Saudade Tom Jobim)" autocomplete="off" autofocus>
        <button type="submit" class="btn primario">Buscar no YouTube</button>
      </form>
      <p id="statusBusca" class="status"></p>
      <div id="resultados" class="resultados"></div>
    </section>

    <!-- BIBLIOTECA -->
    <section id="biblioteca" class="painel">
      <div class="bib">
        <div class="coluna-musicas">
          <input id="filtroBib" type="search" placeholder="Filtrar por título ou artista" autocomplete="off" aria-label="Filtrar biblioteca">
          <aside id="listaMusicas" class="lista-musicas"></aside>
        </div>
        <div id="visor" class="visor vazio">
          <p>Escolha uma música à esquerda.</p>
        </div>
      </div>
    </section>

    <!-- FILA -->
    <section id="fila" class="painel">
      <div class="jobs-topo"><button type="button" id="limparFila" class="btn pequeno" hidden>Limpar concluídos</button></div>
      <div id="listaJobs" class="jobs"></div>
    </section>
  </main>

  <!-- diálogo de geração -->
  <dialog id="dlgGerar">
    <form method="dialog" id="formGerar">
      <div class="dlg-topo">
        <img id="gThumb" alt="">
        <div>
          <p class="mini" id="gVideo"></p>
          <label>Título <input id="gTitulo" required></label>
          <label>Artista <input id="gArtista"></label>
        </div>
      </div>

      <fieldset>
        <legend>Dificuldade</legend>
        <div class="opcoes">
          <label class="op"><input type="checkbox" name="nivel" value="facil" checked><span><b>Fácil</b><small>semínimas, só o baixo, tom sem acidentes</small></span></label>
          <label class="op"><input type="checkbox" name="nivel" value="medio" checked><span><b>Médio</b><small>colcheias, baixo + 3ª e 7ª</small></span></label>
          <label class="op"><input type="checkbox" name="nivel" value="dificil" checked><span><b>Difícil</b><small>semicolcheias, acompanhamento completo</small></span></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Versões</legend>
        <div class="opcoes">
          <label class="op"><input type="checkbox" name="versao" value="Hibrido" checked><span><b>Híbrido</b><small>melodia cantada + acompanhamento da IA</small></span></label>
          <label class="op"><input type="checkbox" name="versao" value="Acordes" checked><span><b>Acordes</b><small>melodia cantada + acordes em bloco</small></span></label>
          <label class="op"><input type="checkbox" name="versao" value="Pop2Piano"><span><b>Pop2Piano</b><small>arranjo completo da IA, sem letra</small></span></label>
          <label class="op"><input type="checkbox" name="versao" value="AMT-APC" checked><span><b>AMT-APC</b><small>outra IA de arranjo (2024), sem letra. Com Híbrido marcado, gera também o Híbrido (AMT)</small></span></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Teor gerado</legend>
        <div class="teor">
          <span class="teor-nome">Introdução<small>feita a partir do refrão</small></span>
          <div class="pilulas" role="radiogroup" aria-label="Introdução"><label class="pilula"><input type="radio" name="intro" value="" checked><span>nenhuma</span></label><label class="pilula"><input type="radio" name="intro" value="calma"><span>calma</span></label><label class="pilula"><input type="radio" name="intro" value="lenta"><span>lenta</span></label><label class="pilula"><input type="radio" name="intro" value="emotiva"><span>emotiva</span></label><label class="pilula"><input type="radio" name="intro" value="animada"><span>animada</span></label><label class="pilula"><input type="radio" name="intro" value="epica"><span>épica</span></label></div>
        </div>
        <div class="teor">
          <span class="teor-nome">Final<small>cadência com fermata</small></span>
          <div class="pilulas" role="radiogroup" aria-label="Final"><label class="pilula"><input type="radio" name="final" value="" checked><span>nenhum</span></label><label class="pilula"><input type="radio" name="final" value="calma"><span>calmo</span></label><label class="pilula"><input type="radio" name="final" value="lenta"><span>lento</span></label><label class="pilula"><input type="radio" name="final" value="emotiva"><span>emotivo</span></label><label class="pilula"><input type="radio" name="final" value="animada"><span>animado</span></label><label class="pilula"><input type="radio" name="final" value="epica"><span>épico</span></label></div>
        </div>
        <div class="teor">
          <span class="teor-nome">Acompanhamento<small>mão esquerda da versão Acordes</small></span>
          <div class="pilulas" role="radiogroup" aria-label="Acompanhamento"><label class="pilula"><input type="radio" name="acomp" value="" checked><span>padrão</span></label><label class="pilula"><input type="radio" name="acomp" value="calma"><span>calmo</span></label><label class="pilula"><input type="radio" name="acomp" value="lenta"><span>lento</span></label><label class="pilula"><input type="radio" name="acomp" value="emotiva"><span>emotivo</span></label><label class="pilula"><input type="radio" name="acomp" value="animada"><span>animado</span></label><label class="pilula"><input type="radio" name="acomp" value="epica"><span>épico</span></label></div>
        </div>
      </fieldset>

      <div class="dlg-linha">
        <label class="linha">Idioma da letra
          <select id="gIdioma">
            <option value="auto">detectar sozinho</option>
            <option value="pt">português</option>
            <option value="en">inglês</option>
            <option value="es">espanhol</option>
            <option value="ja">japonês</option>
          </select>
        </label>
        <label class="linha" id="linhaEscrita" hidden>Letra em japonês
          <select id="gEscrita">
            <option value="romaji">romaji (so-ra)</option>
            <option value="kana">kana (そら)</option>
          </select>
        </label>
      </div>

      <details class="avancado">
        <summary>Avançado</summary>
        <label class="linha" id="linhaEstilo">Estilo do Pop2Piano
          <select id="gEstilo" aria-describedby="ajudaEstilo"></select>
        </label>
        <p class="mini" id="ajudaEstilo">Muda o arranjo do Pop2Piano e do Híbrido (Pop2Piano).</p>
        <label class="linha">Separação da voz
          <select id="gSeparador">
            <option value="htdemucs">4 faixas (padrão)</option>
            <option value="htdemucs_6s">6 faixas, com guitarra e piano (experimento)</option>
          </select>
        </label>
      </details>

      <div class="dlg-acoes">
        <button type="button" id="gCancelar" class="btn">Cancelar</button>
        <button type="submit" id="gOk" class="btn primario">Gerar partitura</button>
      </div>
    </form>
  </dialog>

  <audio id="player" preload="none"></audio>
  <script src="partitura.js?v=3"></script>
  <script src="app.js?v=10"></script>
</body>
</html>
