<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14110f">
  <title>Partitura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20">
  <link rel="icon" type="image/svg+xml" href="icones/favicon.svg">
</head>
<body>
  <!-- INÍCIO: um campo só — filtra a biblioteca enquanto digita; Enter busca no YouTube -->
  <section id="inicio" class="tela">
    <header class="topo">
      <a class="marca" href="#/"><img class="logo" src="icones/logo.svg" alt="" width="36" height="36"><span>Partitura</span></a>
      <form id="formBusca" class="busca" role="search">
        <svg class="ic" aria-hidden="true"><use href="icones/sprite.svg#i-buscar"/></svg>
        <input id="q" type="search" placeholder="Qual música vamos tocar?" autocomplete="off" enterkeyhint="search" aria-label="Música ou artista">
        <button type="submit" class="btn primario">Buscar</button>
      </form>
    </header>
    <main class="conteudo">
      <p id="status" class="status" hidden></p>
      <section id="secResultados" hidden>
        <h2>No YouTube</h2>
        <div id="resultados" class="grade"></div>
      </section>
      <section id="secBiblioteca">
        <h2 id="tituloBib">Sua biblioteca</h2>
        <div id="biblioteca" class="grade"></div>
      </section>
    </main>
  </section>

  <!-- MÚSICA: a partitura ocupa a tela; barra de controle embaixo -->
  <section id="musica" class="tela" hidden>
    <header class="m-topo">
      <a class="m-voltar" href="#/" aria-label="Voltar"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <div class="m-titulo"><b id="mTitulo"></b><small id="mArtista"></small></div>
      <div id="mNiveis" class="niveis" role="group" aria-label="Dificuldade"></div>
    </header>
    <div id="mArea" class="partitura-interativa m-area" aria-label="Partitura"><p>Carregando…</p></div>
    <footer class="m-barra">
      <button type="button" id="mTocar" class="m-play" aria-label="Tocar"></button>
      <div class="m-tempo">
        <input id="mPosicao" type="range" min="0" max="1000" value="0" aria-label="Posição na música">
        <span id="mRelogio" class="m-relogio">0:00 / 0:00</span>
      </div>
      <div id="mFonte" class="niveis m-fonte" role="group" aria-label="O que tocar">
        <button type="button" data-fonte="piano" class="ativa"><svg class="ic" aria-hidden="true"><use href="icones/sprite.svg#i-piano"/></svg><span>Piano</span></button>
        <button type="button" data-fonte="original"><svg class="ic" aria-hidden="true"><use href="icones/sprite.svg#i-fone"/></svg><span>Original</span></button>
      </div>
      <div class="m-acoes">
        <button type="button" class="m-btn" data-acao="menos" aria-label="Diminuir"><svg class="ic" aria-hidden="true"><use href="icones/sprite.svg#i-menos"/></svg></button>
        <button type="button" class="m-btn" data-acao="mais" aria-label="Aumentar"><svg class="ic" aria-hidden="true"><use href="icones/sprite.svg#i-mais"/></svg></button>
        <button type="button" class="m-btn ativo" id="mSeguir" aria-pressed="true" aria-label="Seguir a música" title="Seguir a música"><svg class="ic" aria-hidden="true"><use href="icones/sprite.svg#i-foco"/></svg></button>
        <button type="button" class="m-btn" id="mMais" aria-label="Mais opções" aria-haspopup="menu">⋯</button>
      </div>
      <div id="mMenu" class="m-menu" role="menu" hidden></div>
      <audio id="mPiano" preload="metadata"></audio>
      <audio id="mOriginal" preload="none"></audio>
      <select id="mZoom" hidden></select>
      <input id="mSeguirCaixa" type="checkbox" checked hidden>
      <span id="mMostrador" hidden></span>
    </footer>
  </section>

  <div id="progresso" class="progresso" hidden><span id="progTexto"></span><div class="prog-barra"><i id="progBarra"></i></div></div>
  <div id="aviso" role="status" aria-live="polite"></div>
  <audio id="trecho" preload="none"></audio>

  <script src="partitura.js?v=20"></script>
  <script src="app.js?v=20"></script>
</body>
</html>
