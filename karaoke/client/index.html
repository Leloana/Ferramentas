<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f4ecd8">
    <!-- a página tem tema próprio: o WebView não escurece as cores por conta própria -->
    <meta name="color-scheme" content="light dark">
    <script>
        // tema salvo antes de pintar (sem piscar o claro); o padrão fica em js/theme.js
        try {
            var t = localStorage.getItem('karaoke_theme');
            if (t !== 'dark' && t !== 'light') t = localStorage.getItem('karaoke_tv') === '1' ? 'dark' : null;
            if (t) document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
    </script>
    <title>Karaoke</title>
    <link rel="icon" type="image/svg+xml" href="/assets/art/logo-mark.svg">
    <!--
        Esqueleto da página. O servidor troca cada `@include` pelo parcial
        correspondente (server/utils/html_includes.py) e entrega tudo numa
        resposta só — bom para navegador de TV, sem build step.
        Estilos: um arquivo por área, na ordem da cascata.
    -->
    <link rel="stylesheet" href="/styles/tokens.css">
    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/styles/layout.css">
    <link rel="stylesheet" href="/styles/songs.css">
    <link rel="stylesheet" href="/styles/game.css">
    <link rel="stylesheet" href="/styles/mobile-mic.css">
    <link rel="stylesheet" href="/styles/modals.css">
    <link rel="stylesheet" href="/styles/queue.css">
    <link rel="stylesheet" href="/styles/profile.css">
    <link rel="stylesheet" href="/styles/share-card.css">
    <link rel="stylesheet" href="/styles/states.css">
    <link rel="stylesheet" href="/styles/tv.css">
</head>

<body>
    <div id="app" data-state="idle" data-role="display">

        <!-- Moldura de desempenho (verde/âmbar/vermelho a cada verso) -->
        <div id="perf-border-overlay" class="perf-border-idle"></div>

        <div id="toast-container" class="toast-container" aria-live="polite"></div>

        <!-- @include partials/header.html -->
        <!-- @include partials/mobile-mic.html -->

        <main class="container">
            <div class="main-card">
                <!-- @include partials/selection.html -->
                <!-- @include partials/game.html -->
            </div>
        </main>

        <!-- @include partials/modals/game-over.html -->
        <!-- @include partials/modals/annotate.html -->
        <audio id="audio-player" preload="auto"></audio>
        <audio id="guide-player" preload="none"></audio>
        <!-- @include partials/modals/add-song.html -->
        <!-- @include partials/modals/pairing.html -->
        <!-- @include partials/modals/onboarding.html -->
        <!-- @include partials/modals/lrc-editor.html -->
        <!-- @include partials/modals/generation-options.html -->
        <!-- @include partials/modals/lobby-picker.html -->
        <!-- @include partials/modals/players.html -->
        <!-- @include partials/modals/status.html -->
        <!-- @include partials/modals/cover-picker.html -->
        <!-- @include partials/modals/loading.html -->
        <!-- @include partials/templates.html -->
        <!-- @include partials/score-bars.html -->

    </div>

    <script type="module" src="/js/main.js"></script>
    <!-- Navegador sem ES Modules (TV antiga, ex.: NetRange/Philco): o app não roda.
         Em vez da página parada, avisa e mostra a identificação para diagnóstico.
         Navegadores modernos ignoram <script nomodule>. JS da época (ES3). -->
    <script nomodule>
        (function () {
            var box = document.createElement('div');
            box.setAttribute('style', 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;overflow:auto;padding:40px;background:#221c16;color:#efe4cc;font-family:sans-serif;font-size:22px;line-height:1.5');
            var title = document.createElement('h1');
            title.appendChild(document.createTextNode('Este navegador é antigo demais para o Karaokê'));
            var text = document.createElement('p');
            text.appendChild(document.createTextNode('Use um navegador mais novo (Chrome, Firefox, TV Bro) ou um Chromecast / Google TV nesta TV. Identificação do navegador:'));
            var ua = document.createElement('p');
            ua.setAttribute('style', 'font-family:monospace;font-size:18px;word-wrap:break-word;color:#ecd58f');
            ua.appendChild(document.createTextNode(navigator.userAgent));
            box.appendChild(title);
            box.appendChild(text);
            box.appendChild(ua);
            document.body.appendChild(box);
        })();
    </script>
</body>

</html>
