<!-- Escolha do microfone de uma vaga do lobby (lobby.js monta a lista) -->
<div id="lobby-picker-modal" class="modal-overlay">
    <div class="modal-content admin-modal modal-content--sm">
        <h2 class="modal-title"><button type="button" class="modal-back" data-close aria-label="Voltar" title="Voltar"><i data-icon="back"></i></button><span id="lobby-picker-title">Escolher microfone</span></h2>
        <div id="lobby-picker-list" class="mic-options"></div>
        <div class="modal-buttons">
            <button type="button" class="btn btn--ghost btn-qr-pairing-link" id="btn-picker-pair">
                <i data-icon="qr"></i> Conectar outro celular
            </button>
            <button type="button" class="btn btn--ghost" data-close>Cancelar</button>
        </div>
    </div>
</div>
