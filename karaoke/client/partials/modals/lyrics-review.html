<!-- Revisão de letra (legado: hoje o passo 3 do "Adicionar música" faz esse papel) -->
<div id="lyrics-review-modal" class="modal-overlay">
    <div class="modal-content admin-modal modal-content--md">
        <h2 class="modal-title">Revisar letra da música</h2>
        <div id="lyrics-review-status" class="status-note"></div>
        <div class="form-group">
            <textarea id="lyrics-review-textarea" rows="12" class="input input--area input--tall"
                placeholder="Nenhuma letra encontrada. Cole a letra da música aqui (linha por linha)..."></textarea>
        </div>
        <div class="modal-buttons">
            <button type="button" id="btn-close-lyrics-review" class="btn btn--ghost">Cancelar</button>
            <button type="button" id="btn-confirm-lyrics-review" class="btn btn--primary">Confirmar e continuar</button>
        </div>
    </div>
</div>
