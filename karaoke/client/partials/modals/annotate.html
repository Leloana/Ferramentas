<!-- Anotação dos versos (aberto pelo lápis discreto do fim de jogo) -->
<div id="annotate-modal" class="modal-overlay annotate-modal">
    <div class="annotate-card paper-card" role="dialog" aria-modal="true" aria-labelledby="annotate-title">
        <header class="annotate-header">
            <button id="btn-annotate-close" class="modal-back" type="button" aria-label="Voltar" title="Voltar"><i data-icon="back"></i></button>
            <h2 id="annotate-title" class="annotate-title">Anotar versos</h2>
            <select id="annotate-player" class="input annotate-player" aria-label="Jogador" hidden></select>
        </header>
        <p class="annotate-hint"><i data-icon="cross"></i> verso errado · toque na palavra fora do tempo · sem marca = certo</p>
        <!-- Escrita da letra em música japonesa (lyrics-script.js; mesma escolha do jogo) -->
        <div id="annotate-script" class="sync-control-group lyrics-script-group annotate-script" role="group" aria-label="Escrita da letra" hidden>
            <button type="button" class="btn-control-small lyrics-script-choice" data-script="original" aria-pressed="false">あ Original</button>
            <button type="button" class="btn-control-small lyrics-script-choice" data-script="romaji" aria-pressed="false">Aa Romaji</button>
            <button type="button" class="btn-control-small lyrics-script-choice" data-script="both" aria-pressed="false">Ambos</button>
        </div>
        <ol id="annotate-list" class="annotate-list"></ol>
        <footer class="annotate-footer">
            <span id="annotate-status" class="annotate-status"></span>
            <button id="btn-annotate-save" class="btn btn--primary" type="button">Salvar</button>
        </footer>
    </div>
</div>
