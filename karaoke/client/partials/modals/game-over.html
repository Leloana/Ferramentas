<!-- Fim de jogo: rank (solo) ou pódio (multiplayer, montado em game-view.js) -->
<div id="game-over-modal" class="modal-overlay game-over-modal">
    <div class="modal-content paper-card game-over-card">
        <h2 class="game-over-title">Fim de jogo</h2>
        <p class="game-over-subtitle">Desempenho geral</p>

        <div class="rank-seal">
            <div id="rank-badge" class="rank-badge" data-rank="S">S</div>
        </div>
        <div id="rank-title" class="rank-title">PERFORMANCE LENDÁRIA!</div>

        <div class="score-box">
            <div class="score-box__label">Pontuação média</div>
            <div id="modal-score" class="score-box__value">0.0%</div>
        </div>

        <div id="game-over-record" class="game-over-record" hidden></div>

        <!-- Ouvir a apresentação (um botão por cantor, montado em game-view.js) -->
        <div id="game-over-replay" class="game-over-replay" hidden></div>

        <!-- Próxima da fila da noite: abre sozinha no fim da contagem -->
        <div id="game-over-next" class="game-over-next" hidden>
            <span class="game-over-next__label">Próxima</span>
            <strong id="next-up-text" class="game-over-next__text"></strong>
            <div class="game-over-next__track"><div id="next-up-fill" class="game-over-next__fill"></div></div>
            <div class="game-over-next__actions">
                <button type="button" id="btn-next-now" class="btn btn--primary btn--sm">Agora <span id="next-up-secs"></span></button>
                <button type="button" id="btn-next-cancel" class="btn btn--ghost btn--sm">Cancelar</button>
            </div>
        </div>

        <div class="game-over-actions">
            <button id="btn-share-card" type="button" class="btn btn--lg btn-share-card"><i data-icon="camera"></i> Cartão</button>
            <button id="btn-restart-game" class="btn btn--primary btn--lg">CANTAR NOVAMENTE</button>
        </div>

        <!-- Anotar versos (gabarito do score): discreto de propósito, só para calibração -->
        <button id="btn-annotate-verses" class="annotate-trigger" type="button" hidden
            title="Anotar versos" aria-label="Anotar versos"><i data-icon="edit"></i></button>
    </div>
</div>
