<!-- Escolha do método de geração (PRO × FLASH) -->
<div id="generation-options-modal" class="modal-overlay">
    <div class="modal-content admin-modal modal-content--md">
        <h2 class="modal-title"><button type="button" class="modal-back" data-close aria-label="Voltar" title="Voltar"><i data-icon="back"></i></button>Opções de geração</h2>

        <div class="gen-options">
            <button type="button" id="btn-gen-pro" class="gen-option-card gen-option-card--featured">
                <span class="gen-option-card__head">
                    <span class="gen-option-card__name"><i data-icon="flame"></i> PRO (recomendada)</span>
                    <span class="chip" data-tone="blue">Alta precisão</span>
                </span>
                <span class="gen-option-card__desc">Alinhamento forçado (MMS-FA). Sincroniza a letra exatamente com cada palavra cantada.</span>
                <span class="gen-option-card__meta"><i data-icon="clock"></i> ~2 minutos (ou ~15 s se já separado e no backup)</span>
            </button>

            <button type="button" id="btn-gen-flash" class="gen-option-card">
                <span class="gen-option-card__head">
                    <span class="gen-option-card__name"><i data-icon="bolt"></i> FLASH</span>
                    <span class="chip">Rápido</span>
                </span>
                <span class="gen-option-card__desc">Transcrição direta do Whisper. Sincroniza só por blocos/frases de versos inteiros.</span>
                <span class="gen-option-card__meta gen-option-card__meta--warn"><i data-icon="warning"></i> Rápido, mas precisa de correções manuais de tempos e quebras de versos.</span>
            </button>
        </div>

        <div class="modal-buttons modal-buttons--center">
            <button type="button" id="btn-close-gen-options" class="btn btn--ghost">Fechar</button>
        </div>
    </div>
</div>
