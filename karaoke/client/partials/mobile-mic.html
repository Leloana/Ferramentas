<!-- Celular como microfone (?role=mic). Abas no rodapé: Microfone, Sala (comandar a
     TV: música da vez, sala, iniciar, fila, nova música) e Perfil. -->
<section id="mobile-mic-area" data-tabs="mic-tab">
    <!-- Uma linha: marca "Microfone" e, à direita, apelido · sala (mic-socket.js setMicStatus) -->
    <header class="mic-header">
        <div class="brand brand--sm mic-header__brand">
            <img class="brand__mark" src="/assets/art/logo-mark.svg" alt="" width="28" height="28">
            <h1 class="brand__name">Microfone</h1>
        </div>
        <p id="mobile-status-text" class="mic-header__status">Sala <span id="mobile-room-id">0000</span></p>
    </header>

    <div class="mic-body">
        <!-- Registro do apelido -->
        <div id="mobile-register-container" class="mic-card">
            <input type="text" id="mobile-nickname-input" class="input input--lg" placeholder="Seu apelido" aria-label="Seu apelido" maxlength="15" autocomplete="nickname">
            <button id="btn-mobile-register" class="btn btn--primary btn--block btn--lg">Entrar</button>
            <div id="mobile-register-error" class="form-error"></div>
        </div>

        <!-- Fila de espera para registrar -->
        <div id="mobile-queue-container" class="mic-card">
            <div class="spinner"></div>
            <h3 class="mic-card__title">Na fila</h3>
            <p class="mic-card__hint">Posição <strong id="mobile-queue-position">1</strong></p>
        </div>

        <!-- Microfone ativo -->
        <div id="mobile-active-mic-container">
            <div id="mobile-mic-trigger-container">
                <div id="mobile-mic-vu"></div>
                <button id="btn-mobile-activate" class="mic-button">
                    <i data-icon="mic"></i>
                    <span>LIGAR MIC</span>
                </button>
            </div>

            <!-- Revezar versos: de quem é o verso -->
            <p id="mobile-turn" class="mobile-turn" hidden></p>

            <!-- Letra espelhada -->
            <!-- Verso atual grande e o próximo menor embaixo; a caixa acende na hora de cantar -->
            <div id="mobile-lyrics-container">
                <p id="mobile-lyrics-text">Aguardando a TV</p>
                <p id="mobile-lyrics-next" class="mobile-lyrics-next" hidden></p>
            </div>
            <!-- Reações da plateia: só para quem assiste (mobile/reactions-bar.js) -->
            <div id="mobile-reactions" class="mobile-reactions" role="group" aria-label="Reagir na TV" hidden></div>

            <!-- Nota do verso anterior: fora da letra para não apagar o verso atual -->
            <p id="mobile-score-text" hidden>
                Verso anterior: <span id="mobile-score-last" class="mobile-score__value"></span>
                <span class="mobile-score__total">· Geral: <span id="mobile-score-total"></span></span>
            </p>
        </div>

        <div class="mic-footer">
            <button id="btn-mobile-exit-mic" class="btn btn--ghost btn--sm">
                <i data-icon="phone"></i> Cantar só no celular
            </button>
        </div>
    </div>

    <!-- Aba "Sala": comandar a TV pelo celular (mobile/room-panel.js; servidor: remote_control.py).
         1) música da vez · 2) configuração da sala · 3) iniciar · fila · nova música -->
    <div id="mic-queue-panel" class="mic-queue-panel">
        <section class="room-card">
            <div class="room-card__head">
                <span class="room-card__kicker">Música da vez</span>
                <span id="room-status" class="chip room-status" hidden></span>
            </div>
            <div id="room-song-picker" class="song-picker">
                <button type="button" id="room-song-current" class="song-picker__current" aria-expanded="false">
                    <span class="song-picker__text">
                        <span id="room-song-title" class="song-picker__title">Escolher música</span>
                        <span id="room-song-artist" class="song-picker__artist"></span>
                    </span>
                    <i data-icon="search" class="song-picker__icon"></i>
                </button>
                <div id="room-song-drop" class="song-picker__drop" hidden>
                    <input type="search" id="room-song-search" class="input" placeholder="Buscar pelo nome" aria-label="Buscar música da vez" autocomplete="off">
                    <div id="room-song-results" class="request-songs song-picker__results"></div>
                </div>
            </div>
            <button type="button" id="btn-room-settings" class="room-settings-btn">
                <i data-icon="users"></i>
                <span class="room-settings-btn__text">
                    <span class="room-settings-btn__label">Configuração da sala</span>
                    <span id="room-settings-summary" class="room-settings-btn__summary"></span>
                </span>
                <i data-icon="next"></i>
            </button>
            <button type="button" id="btn-room-start" class="btn btn--primary btn--lg btn--block room-start">
                <i data-icon="play"></i> <span id="room-start-label">Iniciar</span>
            </button>
            <p id="room-start-note" class="room-note" hidden></p>
        </section>

        <!-- Fila da noite: quando a música da vez acaba, a 1ª da fila entra no lugar dela (requests.js) -->
        <section class="room-section">
            <div class="queue-tab-header">
                <span class="queue-items-title">Fila</span>
                <button type="button" id="btn-room-queue-add" class="btn btn--ghost btn--sm" aria-expanded="false">
                    <i data-icon="add"></i> Pôr na fila
                </button>
            </div>
            <div id="room-queue-add" class="room-queue-add" hidden>
                <input type="search" id="mic-request-search" class="input" placeholder="Buscar pelo nome" aria-label="Buscar música para a fila" autocomplete="off">
                <div id="mic-request-songs" class="request-songs"></div>
            </div>
            <ol id="mic-requests" class="mic-requests"></ol>
        </section>

        <section class="room-section">
            <button type="button" class="btn btn--ghost btn--block js-open-add-song">
                <i data-icon="download"></i> Nova música
            </button>
            <div class="queue-tab-header">
                <span class="queue-items-title">Em processamento</span>
            </div>
            <div id="queue-mic-list" class="queue-items-list"></div>
        </section>
    </div>

    <!-- Aba "Perfil": histórico e recordes do apelido deste celular -->
    <div id="mic-profile-panel" class="mic-profile-panel">
        <div id="mic-profile-view" class="players-view"></div>
        <div class="mic-profile-footer">
            <!-- cartão do perfil para baixar (players/profile-card.js) -->
            <button type="button" id="btn-mic-profile-card" class="btn btn--ghost btn--sm" hidden>
                <i data-icon="image"></i> Card
            </button>
            <button type="button" id="btn-mic-logout" class="btn btn--ghost btn--sm" hidden>
                <i data-icon="user"></i> Sair do perfil
            </button>
        </div>
    </div>

    <nav class="app-tabbar mic-tabbar" aria-label="Navegação do microfone">
        <div class="app-tabbar__tabs" role="tablist">
            <button type="button" data-tab="mic" class="tab-btn" role="tab">
                <i data-icon="mic"></i><span class="tab-btn__label">Microfone</span>
            </button>
            <button type="button" data-tab="queue" class="tab-btn" role="tab">
                <i data-icon="songs"></i><span class="tab-btn__label">Sala</span>
            </button>
            <button type="button" data-tab="profile" class="tab-btn" role="tab">
                <i data-icon="user"></i><span class="tab-btn__label">Perfil</span>
            </button>
        </div>
    </nav>
</section>
