models:
  planner: "qwen2.5-coder:7b-instruct-q4_K_M"
  coder: "qwen2.5-coder:7b-instruct-q4_K_M"
  implementer: "qwen2.5-coder:7b-instruct-q4_K_M"

ollama:
  base_url: "http://localhost:11434"
  planner_num_ctx: 8192
  coder_num_ctx: 8192
  implementer_num_ctx: 8192

retrieval:
  top_k: 5
  embedding_model: "ollama:qwen3-embedding-gpu"

retries:
  layer_a: 3
  layer_b: 3
  layer_c: 2
  layer_d: 2

paths:
  runs_dir: "runs/"
  codebase: "."

validation:
  max_plan_steps: 30
  min_pseudocode_lines: 2

tool_whitelist:
  - apply_patch
  - write_file
